name: Deploy support site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/pixel-grid.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build localized pages
        run: python3 scripts/build_site.py
      - name: Check static site
        run: python3 scripts/check_site.py
      - name: Check pixel drawing and JavaScript
        run: |
          node --test scripts/pixel-grid.test.mjs
          node --input-type=module --check < docs/assets/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
